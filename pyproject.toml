[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyetracking-analytics"
version = "1.0.0"
description = "Разметка и анализ движений глаза и взора: переводы взора, фиксации, метрики стабильности"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "AnnaK" }]
keywords = ["eye-tracking", "gaze", "saccade", "fixation", "oculography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Natural Language :: Russian",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/ankorm/eyetracking_analytics"
Issues = "https://github.com/ankorm/eyetracking_analytics/issues"

[project.optional-dependencies]
fast = ["numba>=0.57"]                       # ускорение; на числа не влияет
viz = ["plotly>=5.0", "matplotlib>=3.7", "seaborn>=0.12"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.16,<0.17"]
all = ["eyetracking-analytics[fast,viz,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Собственные предупреждения библиотеки должны быть видны, чужой шум -- нет.
    "ignore::DeprecationWarning:pkg_resources",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# docs/history -- сохранённая прежняя версия API: исторический документ,
# править его нельзя, поэтому и линтовать незачем. В релиз каталог не идёт,
# так что исключение действует только в рабочей ветке.
extend-exclude = ["docs/history"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # длину строк проверяет line-length, дублировать не нужно
    "B905",   # zip(strict=) требует Python 3.10+, но в горячем коде лишний аргумент
]
